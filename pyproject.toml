[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-gradient"
version = "1.0.0"
description = "An integration package connecting Digitalocean and LangChain"
authors = []
readme = "README.md"
repository = "https://github.com/digitalocean/langchain-gradient"
license = "MIT"

[tool.mypy]
disallow_untyped_defs = "True"

[tool.poetry.urls]
"Source Code" = "https://github.com/digitalocean/langchain-gradient"
"Release Notes" = "https://github.com/digitalocean/langchain-gradient/releases/tag/v1.0.0"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-core = ">=0.3.81,<2.0.0"
python-digitalocean = "^1.17.0"
python-dotenv = "^1.0.0"
typing_extensions = "^4.0.0"
pydo = "^0.39.0"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]

[tool.poetry.group.test]
optional = true

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.4"

[tool.poetry.group.test.dependencies]
pytest = ">=7.4.3,<10.0.0"
pytest-asyncio = ">=0.23.2,<2.0.0"
pytest-socket = "^0.7.0"
pytest-watcher = "^0.3.4"
langchain-tests = ">=0.3.20,<2.0.0"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.typing.dependencies]
mypy = "^1.10"
